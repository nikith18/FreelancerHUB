services:
  - type: web
    name: freelancerhub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
